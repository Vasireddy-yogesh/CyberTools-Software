<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberSecure - Phishing Blocked</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background-color: #2b1111;
            border: 2px solid #ff3333;
            padding: 40px;
            border-radius: 12px;
            max-width: 600px;
            box-shadow: 0 0 20px rgba(255, 51, 51, 0.3);
        }
        h1 {
            color: #ff4444;
            margin-top: 0;
            font-size: 32px;
        }
        p {
            font-size: 18px;
            line-height: 1.5;
            color: #cccccc;
        }
        .url-box {
            background-color: #111;
            padding: 15px;
            border-radius: 6px;
            font-family: monospace;
            word-break: break-all;
            margin: 20px 0;
            border: 1px solid #444;
            color: #ff9999;
        }
        .icon {
            font-size: 64px;
            margin-bottom: 20px;
        }
        .button-group {
            margin-top: 30px;
            display: flex;
            gap: 15px;
            justify-content: center;
        }
        .btn {
            padding: 12px 24px;
            border-radius: 6px;
            border: none;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            transition: 0.2s;
        }
        .btn-safe {
            background-color: #0078d4;
            color: white;
        }
        .btn-safe:hover {
            background-color: #005a9e;
        }
        .btn-danger {
            background-color: transparent;
            color: #999;
            border: 1px solid #444;
        }
        .btn-danger:hover {
            color: #ff4444;
            border-color: #ff4444;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🛡️ ❌</div>
        <h1>Access Blocked</h1>
        <p>CyberSecure Phishing Guard has prevented you from accessing a malicious website. This site is known to steal credentials or distribute malware.</p>
        
        <div class="url-box" id="url-display">
            <!-- URL will be inserted here -->
        </div>
        
        <p><strong>Action Taken:</strong> The connection was severed automatically to protect your device.</p>

        <div class="button-group">
            <button class="btn btn-safe" onclick="window.close()">🛡️ Close Tab (Safe)</button>
            <button class="btn btn-danger" onclick="continueToSite()">⚠️ Continue anyway (Unsafe)</button>
        </div>
    </div>
    
    <script>
        // Get URL from query param
        const urlParams = new URLSearchParams(window.location.search);
        const blockedUrl = urlParams.get('url');
        if(blockedUrl) {
            document.getElementById('url-display').innerText = blockedUrl;
        } else {
            document.getElementById('url-display').innerText = "Unknown URL";
        }

        function continueToSite() {
            if(blockedUrl) {
                window.location.href = blockedUrl;
            }
        }
    </script>
</body>
</html>
